name: Security+ checks
on:
  push:
  pull_request:
jobs:
  study-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run practical:validate
      - run: npm run build
      - run: npm run check
